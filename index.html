<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bday method · Choose your language</title>
<meta name="description" content="Choose English, German, or Canadian French for the bday method training page.">
<meta name="author" content="Pierre C. Renschler">
<link rel="alternate" hreflang="en" href="en.html">
<link rel="alternate" hreflang="de" href="de.html">
<link rel="alternate" hreflang="fr-CA" href="fr-ca.html">
<link rel="alternate" hreflang="x-default" href="index.html">
<style>
* { box-sizing: border-box; }
body {
margin: 0;
min-height: 100vh;
display: grid;
place-items: center;
font-family: Arial, sans-serif;
background: linear-gradient(#0b4da2, #083a7a);
color: white;
text-align: center;
}
main {
width: min(900px, calc(100% - 32px));
padding: 28px 20px 40px;
}
.logo-wrap {
display: inline-block;
padding: 10px 14px;
margin-bottom: 18px;
background: rgba(3,20,52,.55);
border-radius: 20px;
box-shadow: 0 0 24px rgba(0,0,0,.28);
}
.logo-wrap img { max-width: min(360px, 70vw); height: auto; display: block; }
.logo-fallback { display: none; padding: 10px 18px; color: #f4b400; font-size: clamp(24px, 6vw, 42px); font-weight: bold; }
.line { height: 6px; background: #f4b400; border-radius: 10px; margin: 20px 0 28px; }
h1 { margin: 0 0 8px; font-size: clamp(30px, 6vw, 46px); }
.lead { margin: 0 0 28px; opacity: .88; font-size: 18px; }
.languages { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.language {
display: block;
padding: 22px 16px;
border: 2px solid transparent;
border-radius: 20px;
background: #1c1c1c;
color: white;
text-decoration: none;
box-shadow: 0 0 20px rgba(0,0,0,.4);
transition: transform .18s ease, border-color .18s ease;
}
.language:hover, .language:focus-visible { transform: translateY(-4px); border-color: #f4b400; outline: none; }
.language img {
width: 100%;
max-width: 190px;
aspect-ratio: 19 / 10;
object-fit: cover;
border-radius: 9px;
box-shadow: 0 0 0 1px rgba(255,255,255,.35), 0 8px 18px rgba(0,0,0,.3);
}
.language strong { display: block; margin-top: 16px; color: #f4b400; font-size: 21px; }
.language span { display: block; margin-top: 5px; opacity: .78; }
footer { margin-top: 30px; opacity: .72; }
@media (max-width: 680px) { .languages { grid-template-columns: 1fr; } .language { padding: 18px; } }
</style>
</head>
<body>
<main>
<div class="logo-wrap"><img src="logo.png" alt="bdaymetho.de" onerror="this.style.display='none';this.nextElementSibling.style.display='block';"><span class="logo-fallback">1643 · bday method</span></div>
<div class="line"></div>
<h1>Choose your language</h1>
<p class="lead">Wähle deine Sprache · Choisissez votre langue</p>
<div class="languages">
<a class="language" href="en.html" lang="en">
<img src="flags/us.svg" alt="Flag of the United States">
<strong>English</strong><span>United States</span>
</a>
<a class="language" href="de.html" lang="de">
<img src="flags/de.svg" alt="Flagge Deutschlands">
<strong>Deutsch</strong><span>Deutschland</span>
</a>
<a class="language" href="fr-ca.html" lang="fr-CA">
<img src="flags/ca.svg" alt="Drapeau du Canada">
<strong>Français</strong><span>Québec · Canada</span>
</a>
</div>
<footer>Pierre C. Renschler</footer>
</main>
</body>
</html>

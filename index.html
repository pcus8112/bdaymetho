<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Find the weekday of any date</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(#0b4da2, #083a7a);
    color: white;
    text-align: center;
}

.container {
    max-width: 500px;
    margin: auto;
    padding: 20px;
}

h1 {
    font-size: 34px;
    margin-bottom: 10px;
}

.highlight {
    color: #f4b400;
}

.line {
    height: 6px;
    background: #f4b400;
    border-radius: 10px;
    margin: 20px 0;
}

.tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
}

.tab {
    padding: 15px;
    border-radius: 15px;
    background: #555;
    color: white;
    font-weight: bold;
}

.active {
    background: #b58900;
}

.card {
    background: #1c1c1c;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 0 20px rgba(0,0,0,0.4);
}

select, button {
    width: 100%;
    padding: 15px;
    margin-top: 10px;
    border-radius: 12px;
    border: none;
    font-size: 16px;
}

button {
    background: #b58900;
    color: white;
    font-weight: bold;
}

.secondary {
    background: #666;
}

.result {
    font-size: 24px;
    margin-top: 20px;
    font-weight: bold;
    color: #f4b400;
}
</style>
</head>

<body>

<div class="container">

<h1>
Find the <span class="highlight">weekday</span><br>
of any date
</h1>

<div class="line"></div>

<div class="tabs">
    <div class="tab active">Basic</div>
    <div class="tab">Advanced</div>
    <div class="tab">Pro</div>
    <div class="tab">The Method</div>
</div>

<div class="card">

<h2>Basic Calculations</h2>
<p>Enter any date. Get the weekday instantly.</p>

<input type="date" id="dateInput">

<button onclick="getWeekday()">Find weekday</button>
<button class="secondary" onclick="randomDate()">Random date</button>

<div class="result" id="result"></div>

</div>

<p style="margin-top:30px; opacity:0.7;">
B-Day Method · Pierre Renschler
</p>

</div>

<script>
function getWeekday() {
    let date = new Date(document.getElementById("dateInput").value);
    if (!date.getTime()) return;

    let days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    document.getElementById("result").innerText = days[date.getDay()];
}

function randomDate() {
    let start = new Date(1900,0,1);
    let end = new Date(2100,11,31);
    let random = new Date(start.getTime() + Math.random()*(end.getTime()-start.getTime()));

    document.getElementById("dateInput").value = random.toISOString().split("T")[0];
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B-Day Method · Find the weekday of any date</title>

<style>
body {
margin: 0;
font-family: Arial, sans-serif;
background: linear-gradient(#0b4da2, #083a7a);
color: white;
text-align: center;
}

.container {
max-width: 900px;
margin: auto;
padding: 20px;
}

.logo-wrap {
display: inline-block;
padding: 10px 14px;
margin-bottom: 10px;
background: rgba(3, 20, 52, 0.55);
border-radius: 20px;
}

.logo-wrap img {
width: 60%; /* 🔥 kleiner gemacht */
}

.solution-link {
margin-top: 15px;
margin-bottom: 10px;
}

.solution-link a {
display: inline-block;
padding: 14px 20px;
background: #f4b400;
color: black;
font-weight: bold;
border-radius: 12px;
text-decoration: none;
font-size: 18px;
}

.solution-link a:hover {
opacity: 0.9;
}

.line {
height: 6px;
background: #f4b400;
border-radius: 10px;
margin: 20px 0;
}

h1 {
font-size: 34px;
}

.highlight {
color: #f4b400;
}

.card {
background: #1c1c1c;
border-radius: 20px;
padding: 20px;
margin-bottom: 20px;
}

input, button {
width: 100%;
padding: 15px;
margin-top: 10px;
border-radius: 12px;
border: none;
font-size: 16px;
}

button {
background: #b58900;
color: white;
font-weight: bold;
cursor: pointer;
}

.result {
font-size: 28px;
margin-top: 20px;
font-weight: bold;
color: #f4b400;
}

.bookbutton {
background:#f4b400;
color:black;
font-size:18px;
}

</style>
</head>

<body>

<div class="container">

<!-- LOGO -->
<div class="logo-wrap">
<img src="logo.png">
</div>

<!-- 🔥 NEUER BLOCK -->
<div class="solution-link">
<a href="https://bdaymetho.gumroad.com">Your solution – No problem!</a>
</div>

<div class="line"></div>

<!-- ORIGINAL CONTENT -->
<h1>
Find the <span class="highlight">weekday</span><br>
of any date
</h1>

<p>Pierre C. Renschler</p>

<div class="line"></div>

<div class="card">
<h3>Your Birth-Weekday – a special Day</h3>
<input type="date" id="birthInput">
<button onclick="showBirthWeekday()">Show my weekday</button>
<div class="result" id="birthResult"></div>
</div>

<div class="card">
<button class="bookbutton">
Available on 05/09/2026
</button>
</div>

</div>

<script>
function showBirthWeekday() {
let input = document.getElementById("birthInput").value;
if (!input) return;
let parts = input.split("-");
let date = new Date(parts[0], parts[1]-1, parts[2]);
let days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
document.getElementById("birthResult").innerText = days[date.getDay()];
}
</script>

</body>
</html>
